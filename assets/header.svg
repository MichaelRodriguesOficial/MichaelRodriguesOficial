<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-label="Michael Rodrigues — Infraestrutura, Automação e Desenvolvimento">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#090D14"/>
      <stop offset="1" stop-color="#0F1724"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#2DD4BF"/>
      <stop offset="1" stop-color="#818CF8"/>
    </linearGradient>
    <radialGradient id="glowA" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#2DD4BF" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#2DD4BF" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowB" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#6366F1" stop-opacity="0.25"/>
      <stop offset="1" stop-color="#6366F1" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#94A3B8" fill-opacity="0.09"/>
    </pattern>
    <clipPath id="frame"><rect width="1200" height="320" rx="18"/></clipPath>
    <style>
      .sans { font-family: 'Inter', 'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif; }
      .mono { font-family: ui-monospace, 'SF Mono', 'JetBrains Mono', Menlo, Consolas, 'DejaVu Sans Mono', monospace; }
      .cursor { animation: blink 1.1s steps(1) infinite; }
      @keyframes blink { 50% { opacity: 0; } }
      .pulse { animation: travel 3.2s linear infinite; }
      .p2 { animation-delay: -1.1s; }
      .p3 { animation-delay: -2.2s; }
      @keyframes travel { from { stroke-dashoffset: 340; } to { stroke-dashoffset: 0; } }
      .node { animation: breathe 3.2s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
      .n2 { animation-delay: -1s; } .n3 { animation-delay: -2s; }
      @keyframes breathe { 0%,100% { opacity: .85; } 50% { opacity: 1; } }
      @media (prefers-reduced-motion: reduce) { .cursor, .pulse, .node { animation: none; } }
    </style>
  </defs>

  <g clip-path="url(#frame)">
    <rect width="1200" height="320" fill="url(#bg)"/>
    <rect width="1200" height="320" fill="url(#dots)"/>
    <circle cx="980" cy="70" r="260" fill="url(#glowA)"/>
    <circle cx="1080" cy="300" r="240" fill="url(#glowB)"/>
    <rect x="0" y="0" width="1200" height="3" fill="url(#accent)"/>

    <!-- texto -->
    <text x="72" y="86" class="mono" font-size="16" fill="#64748B"><tspan fill="#2DD4BF">~</tspan>/michael-rodrigues <tspan fill="#475569">on</tspan> <tspan fill="#818CF8">main</tspan></text>
    <text x="70" y="160" class="sans" font-size="64" font-weight="700" fill="#F8FAFC" letter-spacing="-1.5">Michael Rodrigues</text>
    <text x="72" y="204" class="sans" font-size="24" font-weight="500" fill="#94A3B8">Infraestrutura <tspan fill="#334155">·</tspan> Automação <tspan fill="#334155">·</tspan> Desenvolvimento</text>
    <text x="72" y="256" class="mono" font-size="17" fill="#CBD5E1"><tspan fill="#2DD4BF">❯</tspan> glpi · n8n · docker · python · linux<tspan class="cursor" fill="#2DD4BF"> ▍</tspan></text>

    <!-- grafo de automação -->
    <g fill="none" stroke-linecap="round">
      <path d="M800 110 C 860 110, 880 170, 940 170" stroke="#283548" stroke-width="2"/>
      <path d="M800 230 C 860 230, 880 170, 940 170" stroke="#283548" stroke-width="2"/>
      <path d="M940 170 C 1000 170, 1020 110, 1080 110" stroke="#283548" stroke-width="2"/>
      <path d="M940 170 C 1000 170, 1020 230, 1080 230" stroke="#283548" stroke-width="2"/>

      <path class="pulse" d="M800 110 C 860 110, 880 170, 940 170 C 1000 170, 1020 110, 1080 110" stroke="url(#accent)" stroke-width="2.5" stroke-dasharray="28 312"/>
      <path class="pulse p2" d="M800 230 C 860 230, 880 170, 940 170 C 1000 170, 1020 230, 1080 230" stroke="url(#accent)" stroke-width="2.5" stroke-dasharray="28 312"/>
      <path class="pulse p3" d="M800 110 C 860 110, 880 170, 940 170 C 1000 170, 1020 230, 1080 230" stroke="url(#accent)" stroke-width="2.5" stroke-dasharray="28 312"/>
    </g>

    <g class="mono" font-size="12" text-anchor="middle">
      <g class="node"><rect x="752" y="88" width="96" height="44" rx="10" fill="#0F172A" stroke="#1E293B"/><circle cx="770" cy="110" r="4" fill="#2DD4BF"/><text x="806" y="114" fill="#94A3B8">webhook</text></g>
      <g class="node n2"><rect x="752" y="208" width="96" height="44" rx="10" fill="#0F172A" stroke="#1E293B"/><circle cx="770" cy="230" r="4" fill="#2DD4BF"/><text x="806" y="234" fill="#94A3B8">cron</text></g>
      <g class="node n3"><rect x="892" y="146" width="96" height="48" rx="12" fill="#111827" stroke="#334155"/><circle cx="910" cy="170" r="4" fill="#818CF8"/><text x="946" y="174" fill="#E2E8F0">n8n</text></g>
      <g class="node"><rect x="1032" y="88" width="96" height="44" rx="10" fill="#0F172A" stroke="#1E293B"/><circle cx="1050" cy="110" r="4" fill="#818CF8"/><text x="1086" y="114" fill="#94A3B8">glpi</text></g>
      <g class="node n2"><rect x="1032" y="208" width="96" height="44" rx="10" fill="#0F172A" stroke="#1E293B"/><circle cx="1050" cy="230" r="4" fill="#818CF8"/><text x="1086" y="234" fill="#94A3B8">postgres</text></g>
    </g>

    <rect x="0.5" y="0.5" width="1199" height="319" rx="17.5" fill="none" stroke="#1E293B"/>
  </g>
</svg>
