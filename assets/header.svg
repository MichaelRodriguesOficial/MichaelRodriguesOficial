    <style>
      .cursor { animation: blink 1.1s steps(1) infinite; }
      @keyframes blink { 50% { opacity: 0; } }
      .pulse { stroke-dasharray: 16 84; animation: travel 2.2s linear infinite; }
      @keyframes travel { from { stroke-dashoffset: 100; } to { stroke-dashoffset: 0; } }
      .flow { animation: drip 1.2s linear infinite; }
      @keyframes drip { to { stroke-dashoffset: -18; } }
      .node { animation: breathe 3.6s ease-in-out infinite; }
      @keyframes breathe { 0%,100% { opacity: .82; } 50% { opacity: 1; } }
      .halo { animation: halo 2.2s ease-in-out infinite; }
      @keyframes halo { 0%,100% { opacity: .35; } 50% { opacity: 1; } }
      @media (prefers-reduced-motion: reduce) { .cursor, .pulse, .flow, .node, .halo { animation: none; } }
    </style>
  </defs>
